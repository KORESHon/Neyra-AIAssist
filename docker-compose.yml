# Neyra в Docker Desktop (Windows/Mac/Linux).
# Запуск: скопируйте .env из .env.example, затем: docker compose up --build
#
# API с хоста: http://127.0.0.1:8787/v1/health
# MCP (Cursor на хосте): NEYRA_API_BASE=http://127.0.0.1:8787, NEYRA_API_TOKEN=<INTERNAL_API_TOKEN>
# Логи MCP read_neyra_logs: укажите NEYRA_LOG_PATH на файл в примонтированной ./logs или откройте репозиторий на хосте.

services:
  neyra:
    build: .
    ports:
      - "8787:8787"
    env_file:
      - path: .env
        required: false
    environment:
      # Слушать все интерфейсы внутри контейнера (обязательно для проброса порта).
      INTERNAL_API_BIND_HOST: "0.0.0.0"
      # Разрешить POST /v1/debug/lifecycle (stop/restart процесса); без этого endpoint вернёт 403.
      NEYRA_DEBUG_LIFECYCLE: "1"
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./interfaces:/app/interfaces
      - ./memory:/app/memory
      - ./logs:/app/logs
      # Опционально: уже собранный дашборд
      - ./frontend/dist:/app/frontend/dist:ro
    restart: unless-stopped
